# Aplikācijas konfigurācija. Var pārrakstīt ar vides mainīgajiem (piem. LIBRARY_LOAN_PERIOD_DAYS=7)
# vai profiliem: application-prod.yml + --spring.profiles.active=prod

spring:
  application:
    name: be-macibas

  datasource:
    # In-memory H2 datubāze. Produkcijā te būtu Postgres URL, un parole nāktu no vides mainīgā/secret.
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    # create-drop: Hibernate pats izveido tabulas no @Entity. Produkcijā: validate + Flyway/Liquibase migrācijas!
    hibernate:
      ddl-auto: create-drop
    # Open Session In View izslēgts — lazy ielāde NEnotiek kontrolierī/JSON serializācijā.
    # Spiež visu ielādēt servisā transakcijas iekšā. Labā prakse.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true   # http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:library, user: sa)

  # Java 21 virtuālie pavedieni Tomcat pieprasījumiem (Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

logging:
  level:
    # Ieslēdz, lai redzētu SQL vaicājumus konsolē (noder N+1 problēmas demonstrēšanai)
    org.hibernate.SQL: debug
    lv.macibas: debug

# Mūsu pašu konfigurācija -> LibraryProperties.java
library:
  max-active-loans-per-borrower: 3
  loan-period-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
